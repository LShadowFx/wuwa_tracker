{% extends "plantilla.html" %}
{% load crispy_forms_tags %}
{% block titulo %}Simular tiradas{% endblock %}

{% block contenido %}
<div class="auth-fondo">
    <div class="auth-panel">
        <span class="etiqueta">Convocación</span>
        <h1>Simular tiradas</h1>
        <p class="sub">Elige el banner y cuántas tiradas quieres hacer.</p>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class="btn-w btn-w--cian btn-w--block" style="margin-top:.6rem">Tirar</button>
        </form>
    </div>
</div>
{% endblock %}
