{# Tarjeta compacta de un item. Parametros: item, mostrar_banner (opcional). Lleva al detalle. #}
<a class="eco eco--{{ item.rareza }}{% if item.es_destacado %} es-destacado{% endif %}"
   href="{% url 'gacha:item_detalle' item.slug %}" title="Ver detalle de {{ item.nombre }}">
    <div class="eco-arte"><img src="{{ item.imagen.url }}" alt="{{ item.nombre }}" loading="lazy"></div>
    <div class="eco-info">
        <div class="eco-nombre">{{ item.nombre }}</div>
        <div class="estrellas estrellas--{{ item.rareza }}">{% include "includes/estrellas.html" with rareza=item.rareza %}</div>
        <div class="eco-meta">{{ item.get_categoria_display }}{% if mostrar_banner %} · {{ item.banner.nombre }}{% endif %}</div>
        <span class="eco-ver">Ver detalle</span>
    </div>
</a>
