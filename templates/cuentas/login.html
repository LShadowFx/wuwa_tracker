{% extends "plantilla.html" %}
{% load crispy_forms_tags %}
{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
<div class="auth-backdrop">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card auth-card">
                <div class="auth-card-top"></div>
                <div class="card-body p-4">
                    <h1 class="h4 fw-bold mb-1">Iniciar sesión</h1>
                    <p class="text-secondary small mb-3">Usa una de las cuentas de prueba del README.</p>
                    <form method="post">
                        {% csrf_token %}
                        {{ form | crispy }}
                        <button type="submit" class="btn btn-info w-100 mt-2">Entrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
