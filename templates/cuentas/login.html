{% extends "plantilla.html" %}
{% load crispy_forms_tags %}
{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
<div class="auth-fondo">
    <div class="auth-panel">
        <svg class="emblema" viewBox="0 0 32 32" fill="none" stroke="#5ee3ee" stroke-width="1.6" aria-hidden="true">
            <path d="M16 2 28 9v14L16 30 4 23V9z" />
            <path d="M8 17c3-6 5-6 8 0s5 6 8 0" stroke-linecap="round" />
        </svg>
        <span class="etiqueta">Acceso de Resonador</span>
        <h1>Iniciar sesión</h1>
        <p class="sub">Usa una de las cuentas de prueba del README.</p>
        <form method="post">
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class="btn-w btn-w--cian btn-w--block" style="margin-top:.6rem">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
