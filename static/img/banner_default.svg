<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" width="1600" height="650" role="img" aria-label="Portada genérica de banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glowCian" cx="12%" cy="8%" r="65%">
      <stop offset="0%" stop-color="#5ee3ee" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5ee3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowVioleta" cx="88%" cy="95%" r="70%">
      <stop offset="0%" stop-color="#b48cff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#b48cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOro" cx="80%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#f7c94b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f7c94b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="facetaCian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ee3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5ee3ee" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="facetaOro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7c94b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f7c94b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="facetaVioleta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b48cff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#b48cff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="650" fill="#0a1520"/>
  <rect width="1600" height="650" fill="url(#grid)"/>
  <rect width="1600" height="650" fill="url(#glowCian)"/>
  <rect width="1600" height="650" fill="url(#glowVioleta)"/>
  <rect width="1600" height="650" fill="url(#glowOro)"/>

  <!-- Cristal facetado abstracto, apoyado a la derecha (la franja izquierda queda cubierta
       por el degradado oscuro del overlay del sitio, asi que el detalle importa mas aca). -->
  <g transform="translate(1180,320)" opacity="0.9">
    <polygon points="0,-230 150,-120 170,60 40,200 -140,160 -200,-40 -120,-190" fill="none" stroke="#5ee3ee" stroke-opacity="0.35" stroke-width="2"/>
    <polygon points="0,-230 150,-120 20,-40" fill="url(#facetaCian)"/>
    <polygon points="150,-120 170,60 20,-40" fill="url(#facetaOro)"/>
    <polygon points="170,60 40,200 20,-40" fill="url(#facetaVioleta)"/>
    <polygon points="40,200 -140,160 20,-40" fill="url(#facetaCian)"/>
    <polygon points="-140,160 -200,-40 20,-40" fill="url(#facetaOro)"/>
    <polygon points="-200,-40 -120,-190 20,-40" fill="url(#facetaVioleta)"/>
    <polygon points="-120,-190 0,-230 20,-40" fill="url(#facetaCian)"/>
  </g>

  <!-- Satelites pequenos, para dar sensacion de "convocacion" sin dibujar un personaje puntual. -->
  <g opacity="0.55">
    <polygon points="1390,150 1420,180 1390,230 1360,200" fill="none" stroke="#f7c94b" stroke-opacity="0.5" stroke-width="2"/>
    <polygon points="1300,470 1335,495 1310,540 1270,520" fill="none" stroke="#b48cff" stroke-opacity="0.5" stroke-width="2"/>
    <polygon points="980,540 1010,560 985,595 950,580" fill="none" stroke="#5ee3ee" stroke-opacity="0.45" stroke-width="2"/>
  </g>

  <!-- Esquinas biseladas, en linea con el resto del sitio (ver la variable "biselado" del CSS). -->
  <path d="M0 0 L46 0 L0 46 Z" fill="#5ee3ee" opacity="0.06"/>
  <path d="M1600 650 L1554 650 L1600 604 Z" fill="#b48cff" opacity="0.06"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
